services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: learnpath-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # SQL Server 2022 images ship mssql-tools18 and require -C to trust the
      # self-signed certificate it presents.
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
            -P "${DB_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - learnpath-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnpath-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # LEARNPATH_* names are enforced by the application's startup
      # configuration validation (Program.cs) — do not rename them.
      LEARNPATH_DB_CONNECTION: >-
        Server=db,1433;Database=LearnPathDb;
        User Id=sa;Password=${DB_SA_PASSWORD};
        TrustServerCertificate=True;
      LEARNPATH_JWT_SECRET: "${JWT_SECRET}"
      LEARNPATH_NVIDIA_API_KEY: "${LEARNPATH_NVIDIA_API_KEY}"
      JwtSettings__Issuer: "LearnPathAPI"
      JwtSettings__Audience: "LearnPathClient"
      JwtSettings__ExpiryMinutes: "60"
      JwtSettings__RefreshTokenExpiryDays: "7"
      AllowedOrigins: "${FRONTEND_URL}"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck lives in backend/Dockerfile (curl /api/v1/health).
    networks:
      - learnpath-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
    container_name: learnpath-web
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - learnpath-net
    restart: unless-stopped

volumes:
  sqldata:

networks:
  learnpath-net:
    driver: bridge
