name: LearnPath CI

# Runs on every push and PR. The backend test suite uses the EF InMemory
# database provider, so no database service or secrets are required.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: ./backend.Tests
        run: dotnet restore LearnPath.Tests.csproj

      - name: Build
        working-directory: ./backend.Tests
        run: dotnet build LearnPath.Tests.csproj -c Release --no-restore

      - name: Test
        working-directory: ./backend.Tests
        run: dotnet test LearnPath.Tests.csproj -c Release --no-build --verbosity normal

  frontend:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # NOTE: `npm run type-check` and `npm run lint` currently fail with
      # PRE-EXISTING issues (TS 5.3 vs an old `--ignoreDeprecations` value in
      # tsconfig.json; no ESLint configuration file in the repo. They are
      # excluded until those are approved for fixing. `npm run build` (vite)
      # passes and IS included below.
      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1
